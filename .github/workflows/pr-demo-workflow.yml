name: PR Demo Workflow

on:
  pull_request:
    branches:
      - master

jobs:
  job-1:
    name: Job 1
    runs-on: ubuntu-latest
    steps:
      - name: "Display PR Information"
        id: pr-info
        run: |
          # Plain text log output
          echo "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

          # Rich Markdown table in Job Summary (visible on Actions summary page)
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## :memo: Pull Request Information

          | Field | Value |
          |-------|-------|
          | **PR Number** | #${{ github.event.pull_request.number }} |
          | **Title** | ${{ github.event.pull_request.title }} |
          | **State** | ${{ github.event.pull_request.state }} |
          | **Action** | ${{ github.event.action }} |
          | **URL** | [${{ github.event.pull_request.html_url }}](${{ github.event.pull_request.html_url }}) |
          | **Author** | @${{ github.event.pull_request.user.login }} |
          | **Source Branch** | `${{ github.event.pull_request.head.ref }}` |
          | **Target Branch** | `${{ github.event.pull_request.base.ref }}` |
          | **Commits** | ${{ github.event.pull_request.commits }} |
          | **Changed Files** | ${{ github.event.pull_request.changed_files }} |
          | **Additions** | +${{ github.event.pull_request.additions }} |
          | **Deletions** | -${{ github.event.pull_request.deletions }} |
          | **Created At** | ${{ github.event.pull_request.created_at }} |
          | **Updated At** | ${{ github.event.pull_request.updated_at }} |
          | **Mergeable** | ${{ github.event.pull_request.mergeable }} |
          | **Draft** | ${{ github.event.pull_request.draft }} |
          EOF

          # Pass custom variable to next steps via step output
          echo "pr_summary=#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT

      - name: "Job:1, Action:1, Step:1"
        id: step1
        run: |
          echo "It is Job:1, Action:1, Step:1 now ..."
          echo "PR #: ${{ github.event.pull_request.number }}"
          echo "PR Summary (from prev step output): ${{ steps.pr-info.outputs.pr_summary }}"
          # Method 1: Pass variable via step output (GITHUB_OUTPUT)
          echo "step1_msg=Hello from Step1, PR #${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          # Method 2: Pass variable via environment (GITHUB_ENV) - available to ALL subsequent steps
          echo "MY_VAR=This env var was set in Step1" >> $GITHUB_ENV

      - name: "Job:1, Action:1, Step:2"
        run: |
          echo "It is Job:1, Action:1, Step:2 now ..."
          echo "--- Reading from Step1 via step output ---"
          echo "Step1 said: ${{ steps.step1.outputs.step1_msg }}"
          echo "--- Reading from Step1 via GITHUB_ENV ---"
          echo "Env var: $MY_VAR"

      - name: "Job:1, Action:2, Step:1"
        run: echo "It is Job:1, Action:2, Step:1 now ..."

      - name: "Job:1, Action:2, Step:2"
        run: echo "It is Job:1, Action:2, Step:2 now ..."

  job-2:
    name: Job 2
    runs-on: ubuntu-latest
    steps:
      - name: "Job:2, Action:1, Step:1"
        run: echo "It is Job:2, Action:1, Step:1 now ..."

      - name: "Job:2, Action:1, Step:2"
        run: echo "It is Job:2, Action:1, Step:2 now ..."

      - name: "Job:2, Action:2, Step:1"
        run: echo "It is Job:2, Action:2, Step:1 now ..."

      - name: "Job:2, Action:2, Step:2"
        run: echo "It is Job:2, Action:2, Step:2 now ..."
